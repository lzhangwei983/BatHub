[package]
name = "bathub"
version = "0.1.0"
edition = "2021"
description = "Zero-config smart Windows batch script organizer, launcher, and service monitor"

[dependencies]
tao = "0.30"
wry = "0.47"
tray-icon = "0.19"
global-hotkey = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
encoding_rs = "0.8"
regex = "1.11"
sysinfo = "0.32"
rfd = "0.15"
winreg = "0.52"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Networking_WinSock",
  "Win32_NetworkManagement_IpHelper",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
